[project]
name = "order-reprocessing-agent"
version = "0.1.0"
description = "AI-powered Order Reprocessing Agent for telco BSS, built on Amazon Bedrock AgentCore (AWS Samples / Workshop reference implementation)"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "moto[dynamodb]>=5.0.0",
    "aws-cdk-lib==2.261.0",
    "constructs>=10.3.0,<11.0.0",
]
ui = [
    "streamlit>=1.35.0",
]
agent = [
    "bedrock-agentcore==1.17.0",
    "strands-agents==1.46.0",
    "mcp==1.28.1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e: end-to-end tests requiring a REAL deployed AWS stack (operatingMode=DEMO). Excluded by default — run explicitly via `pytest tests/e2e/ -m e2e`.",
]
addopts = "-m 'not e2e'"

